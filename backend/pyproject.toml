[project]
name = "iafluence-booking"
version = "1.0.0"
description = "IAfluence Booking — réservation de la première session de conseil IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "stripe>=10.0",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "websockets>=15",
    "resvg-py>=0.2",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
]
mutation = [
    "mutmut>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # runpy re-executes scripts.* as __main__ in the CLI tests.
    "ignore:.*found in sys.modules after import of package:RuntimeWarning",
]

[tool.coverage.run]
source = ["app", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# Mutation testing — Linux/macOS only (mutmut needs fork()). On Windows: ./mutation.sh runs it in Docker.
[tool.mutmut]
source_paths = ["app/"]
# Declarative code (ORM/pydantic models, wiring) and the local demo fakes: mutants there are noise.
do_not_mutate = [
    "app/models.py",
    "app/schemas.py",
    "app/db.py",
    "app/config.py",
    "app/deps.py",
    "app/dev_fakes.py",
    "app/services/google_client.py",
]
# Log lines are for humans; mutating their wording is noise.
do_not_mutate_patterns = ['^\s*log\.(debug|info|warning|exception)\(']
also_copy = ["alembic/", "alembic.ini", "scripts/", "tests/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
