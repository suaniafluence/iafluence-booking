<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img">
<title>Architecture de iafluence-booking</title>
<desc>Le client et l'admin passent par le frontend React, qui parle au backend FastAPI ; le backend échange avec Stripe, Google Agenda, Gmail et PostgreSQL.</desc>
<style>
text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.bg{fill:#FFFFFF}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.mk{stroke:#888780}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){
.bg{fill:#1F1E1D}
.th{fill:#F1EFE8}.ts{fill:#B4B2A9}
.arr,.mk{stroke:#888780}
.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}
.c-gray>.th{fill:#D3D1C7}.c-gray>.ts{fill:#B4B2A9}
.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}
.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}
.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}
.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="500" rx="8"/>
<g class="c-gray"><rect x="80" y="40" width="200" height="52" rx="4"/><text class="th" x="180" y="62" text-anchor="middle">Client</text><text class="ts" x="180" y="80" text-anchor="middle">paie, choisit un créneau</text></g>
<g class="c-gray"><rect x="400" y="40" width="200" height="52" rx="4"/><text class="th" x="500" y="62" text-anchor="middle">Admin</text><text class="ts" x="500" y="80" text-anchor="middle">suit, ajoute, annule, ajuste</text></g>
<line class="arr" x1="180" y1="92" x2="180" y2="148" marker-end="url(#arrow)"/>
<text class="ts" x="190" y="125">token, créneau choisi</text>
<line class="arr" x1="500" y1="92" x2="500" y2="148" marker-end="url(#arrow)"/>
<text class="ts" x="490" y="125" text-anchor="end">mot de passe, actions</text>
<g class="c-purple"><rect x="80" y="150" width="520" height="52" rx="4"/><text class="th" x="340" y="172" text-anchor="middle">Frontend React</text><text class="ts" x="340" y="190" text-anchor="middle">/reservation/{token} · /admin</text></g>
<line class="arr" x1="280" y1="202" x2="280" y2="258" marker-end="url(#arrow)"/>
<text class="ts" x="270" y="234" text-anchor="end">token, créneau, actions</text>
<line class="arr" x1="400" y1="260" x2="400" y2="204" marker-end="url(#arrow)"/>
<text class="ts" x="410" y="234">créneaux {start, end}, heures</text>
<g class="c-purple"><rect x="80" y="260" width="520" height="52" rx="4"/><text class="th" x="340" y="282" text-anchor="middle">Backend FastAPI</text><text class="ts" x="340" y="300" text-anchor="middle">API publique et admin · webhook Stripe · job chaque minute</text></g>
<path class="arr" d="M80 66 L56 66 L56 388" marker-end="url(#arrow)"/>
<line class="arr" x1="107" y1="314" x2="107" y2="388" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="262" y1="314" x2="262" y2="388" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="417" y1="314" x2="417" y2="388" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="572" y1="314" x2="572" y2="388" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="390" width="135" height="64" rx="4"/><text class="th" x="107" y="412" text-anchor="middle">Stripe</text><text class="ts" x="107" y="430" text-anchor="middle">paiement vérifié</text><text class="ts" x="107" y="446" text-anchor="middle">remboursements</text></g>
<g class="c-teal"><rect x="195" y="390" width="135" height="64" rx="4"/><text class="th" x="262" y="412" text-anchor="middle">Google Agenda</text><text class="ts" x="262" y="430" text-anchor="middle">free/busy seul</text><text class="ts" x="262" y="446" text-anchor="middle">événement + Meet</text></g>
<g class="c-teal"><rect x="350" y="390" width="135" height="64" rx="4"/><text class="th" x="417" y="412" text-anchor="middle">Gmail</text><text class="ts" x="417" y="430" text-anchor="middle">emails client</text><text class="ts" x="417" y="446" text-anchor="middle">et alertes admin</text></g>
<g class="c-teal"><rect x="505" y="390" width="135" height="64" rx="4"/><text class="th" x="572" y="412" text-anchor="middle">PostgreSQL</text><text class="ts" x="572" y="430" text-anchor="middle">achats, tokens</text><text class="ts" x="572" y="446" text-anchor="middle">séances, règles</text></g>
<rect class="c-gray" x="40" y="474" width="12" height="12" rx="2"/><text class="ts" x="58" y="484">personnes</text>
<rect class="c-purple" x="150" y="474" width="12" height="12" rx="2"/><text class="ts" x="168" y="484">l'app (ce repo)</text>
<rect class="c-teal" x="290" y="474" width="12" height="12" rx="2"/><text class="ts" x="308" y="484">services externes</text>
</svg>
