<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1080" viewBox="0 0 680 1080" role="img">
<title>Types de rendez-vous : parcours</title>
<desc>Trois façons d'obtenir un accès (achat Stripe, ajout manuel, inscription libre gratuite), chacune liée à un type de rendez-vous qui fixe la durée, l'agenda, le compte rendu et l'email de fin.</desc>
<style>
text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.bg{fill:#FFFFFF}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.mk{stroke:#888780}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){
.bg{fill:#1F1E1D}
.th{fill:#F1EFE8}.ts{fill:#B4B2A9}
.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}
.c-gray>.th{fill:#D3D1C7}.c-gray>.ts{fill:#B4B2A9}
.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}
.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}
.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}
.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="1080" rx="8"/>

<!-- 1. Trois entrées -->
<g class="c-gray"><rect x="20" y="40" width="200" height="90" rx="4"/><text class="th" x="120" y="66" text-anchor="middle">Achat sur Stripe</text><text class="ts" x="120" y="86" text-anchor="middle">payant · Payment Link</text><text class="ts" x="120" y="104" text-anchor="middle">produit lié à un type</text></g>
<g class="c-gray"><rect x="240" y="40" width="200" height="90" rx="4"/><text class="th" x="340" y="66" text-anchor="middle">Ajout manuel</text><text class="ts" x="340" y="86" text-anchor="middle">admin · payé hors site</text><text class="ts" x="340" y="104" text-anchor="middle">ou offert</text></g>
<g class="c-teal"><rect x="460" y="40" width="200" height="90" rx="4"/><text class="th" x="560" y="66" text-anchor="middle">Inscription libre</text><text class="ts" x="560" y="86" text-anchor="middle">gratuit · /rdv/decouverte</text><text class="ts" x="560" y="104" text-anchor="middle">1 RDV à venir par email</text><text class="ts" x="560" y="120" text-anchor="middle">anti-robots · limite par IP</text></g>
<path class="arr" d="M120 130 L120 150 L560 150 L560 130"/>
<line class="arr" x1="340" y1="130" x2="340" y2="168" marker-end="url(#arrow)"/>

<!-- 2. Accès -->
<g class="c-teal"><rect x="160" y="170" width="360" height="56" rx="4"/><text class="th" x="340" y="192" text-anchor="middle">Accès créé, lié à un type de RDV</text><text class="ts" x="340" y="210" text-anchor="middle">0 € si gratuit · lien sécurisé (token)</text></g>
<line class="arr" x1="340" y1="226" x2="340" y2="264" marker-end="url(#arrow)"/>

<!-- 3. Créneaux -->
<g class="c-gray"><rect x="160" y="266" width="360" height="70" rx="4"/><text class="th" x="340" y="288" text-anchor="middle">Créneaux libres</text><text class="ts" x="340" y="306" text-anchor="middle">durée du type · horaires communs à tous les types</text><text class="ts" x="340" y="322" text-anchor="middle">free/busy de tous les agendas activés</text></g>
<line class="arr" x1="340" y1="336" x2="340" y2="374" marker-end="url(#arrow)"/>

<!-- 4. Vérification -->
<g class="c-purple"><rect x="160" y="376" width="360" height="56" rx="4"/><text class="th" x="340" y="398" text-anchor="middle">Créneau encore libre ?</text><text class="ts" x="340" y="416" text-anchor="middle">verrou + aucun chevauchement, tous types confondus</text></g>
<g class="c-gray"><rect x="20" y="376" width="110" height="56" rx="4"/><text class="th" x="75" y="398" text-anchor="middle">Refusé</text><text class="ts" x="75" y="416" text-anchor="middle">autre créneau</text></g>
<line class="arr" x1="160" y1="404" x2="132" y2="404" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="432" x2="340" y2="470" marker-end="url(#arrow)"/>

<!-- 5. Rendez-vous -->
<g class="c-teal"><rect x="160" y="472" width="360" height="56" rx="4"/><text class="th" x="340" y="494" text-anchor="middle">Rendez-vous créé</text><text class="ts" x="340" y="512" text-anchor="middle">dans l'agenda du type · titre du type · Meet</text></g>
<g class="c-gray"><rect x="540" y="472" width="120" height="56" rx="4"/><text class="th" x="600" y="494" text-anchor="middle">Emails</text><text class="ts" x="600" y="512" text-anchor="middle">client + admin</text></g>
<line class="arr" x1="520" y1="500" x2="538" y2="500" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="528" x2="340" y2="566" marker-end="url(#arrow)"/>

<!-- 6. Fin de séance -->
<g class="c-gray"><rect x="160" y="568" width="360" height="56" rx="4"/><text class="th" x="340" y="590" text-anchor="middle">Fin de séance</text><text class="ts" x="340" y="608" text-anchor="middle">confirmed → completed</text></g>
<line class="arr" x1="340" y1="624" x2="340" y2="662" marker-end="url(#arrow)"/>

<!-- 7. Compte rendu -->
<g class="c-purple"><rect x="160" y="664" width="360" height="56" rx="4"/><text class="th" x="340" y="686" text-anchor="middle">Compte rendu prévu par le type ?</text><text class="ts" x="340" y="704" text-anchor="middle">Fireflies + Codex, avec les consignes du type</text></g>
<path class="arr" d="M340 720 L340 740 L120 740 L120 758" marker-end="url(#arrow)"/>
<path class="arr" d="M340 740 L560 740 L560 758" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="720" x2="340" y2="758" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="20" y="760" width="200" height="56" rx="4"/><text class="th" x="120" y="782" text-anchor="middle">Aucun</text><text class="ts" x="120" y="800" text-anchor="middle">email sans résumé</text></g>
<g class="c-gray"><rect x="240" y="760" width="200" height="56" rx="4"/><text class="th" x="340" y="782" text-anchor="middle">Brouillon Gmail</text><text class="ts" x="340" y="800" text-anchor="middle">tu relis avant l'envoi</text></g>
<g class="c-gray"><rect x="460" y="760" width="200" height="56" rx="4"/><text class="th" x="560" y="782" text-anchor="middle">Envoi auto</text><text class="ts" x="560" y="800" text-anchor="middle">sans relecture</text></g>
<path class="arr" d="M120 816 L120 836 L560 836 L560 816"/>
<line class="arr" x1="340" y1="816" x2="340" y2="854" marker-end="url(#arrow)"/>

<!-- 8. Email de fin -->
<g class="c-purple"><rect x="160" y="856" width="360" height="56" rx="4"/><text class="th" x="340" y="878" text-anchor="middle">Email de fin choisi par le type</text><text class="ts" x="340" y="896" text-anchor="middle">porte le compte rendu s'il y en a un</text></g>
<path class="arr" d="M340 912 L340 932 L120 932 L120 950" marker-end="url(#arrow)"/>
<path class="arr" d="M340 932 L560 932 L560 950" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="912" x2="340" y2="950" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="20" y="952" width="200" height="56" rx="4"/><text class="th" x="120" y="974" text-anchor="middle">Réservez la prochaine</text><text class="ts" x="120" y="992" text-anchor="middle">heures restantes · sinon merci</text></g>
<g class="c-teal"><rect x="240" y="952" width="200" height="56" rx="4"/><text class="th" x="340" y="974" text-anchor="middle">Merci + prochaine étape</text><text class="ts" x="340" y="992" text-anchor="middle">prospect : devis, offre…</text></g>
<g class="c-teal"><rect x="460" y="952" width="200" height="56" rx="4"/><text class="th" x="560" y="974" text-anchor="middle">Aucun email</text><text class="ts" x="560" y="992" text-anchor="middle">compte rendu dans l'admin</text></g>

<!-- Légende -->
<rect class="c-gray" x="130" y="1040" width="14" height="14" rx="2"/><text class="ts" x="150" y="1052">existe déjà</text>
<rect class="c-teal" x="260" y="1040" width="14" height="14" rx="2"/><text class="ts" x="280" y="1052">nouveau ou modifié</text>
<rect class="c-purple" x="420" y="1040" width="14" height="14" rx="2"/><text class="ts" x="440" y="1052">vérification / choix</text>
</svg>
