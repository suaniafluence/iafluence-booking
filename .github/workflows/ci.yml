# Tests run on every push to main and every pull request.
# Also called by deploy-prod.yml: nothing is built or deployed unless this passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      # Integration tests need a real PostgreSQL (exclusion constraint, advisory locks).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iafluence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iafluence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/iafluence_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (runtime + dev group)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc -b
