services:
  # Bundled database, started only with COMPOSE_PROFILES=localdb in .env.
  # Production uses a managed Postgres instead (Neon): set DATABASE_URL and leave COMPOSE_PROFILES out.
  db:
    profiles: [localdb]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ../backend
    # One tag per release (set by deploy/release.sh) so a rollback reuses the previous image without rebuilding.
    image: iafluence-booking-api:${RELEASE_ID:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
    depends_on:
      db:
        condition: service_healthy
        required: false

  web:
    # Stock Caddy image: the React app is built by CI and shipped as frontend/dist in the release,
    # so nothing (no Node, no npm) is needed on the server.
    # Plain HTTP on localhost only: the host's nginx owns ports 80/443 and terminates TLS.
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3004}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv:ro
    depends_on:
      - api

volumes:
  pgdata:
